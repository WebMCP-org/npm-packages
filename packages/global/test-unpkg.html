<!doctype html>
<html>
  <head>
    <title>Test IIFE - unpkg CDN</title>
    <!-- Test with unpkg - using specific version to bypass cache -->
    <script src="https://unpkg.com/@mcp-b/global@4.0.0/dist/index.iife.js"></script>
  </head>
  <body>
    <h1>My AI-Powered App (unpkg Test)</h1>
    <div id="status"></div>

    <script type="module">
      const statusEl = document.getElementById('status');

      // Check if document.modelContext is available
      if (document.modelContext) {
        statusEl.innerHTML = '<p style="color: green;">✅ document.modelContext is available!</p>';

        try {
          // Register tools with AI agents
          await document.modelContext.registerTool({
            name: 'get-page-title',
            description: 'Get the current page title',
            inputSchema: {
              type: 'object',
              properties: {},
            },
            async execute() {
              return {
                content: [
                  {
                    type: 'text',
                    text: document.title,
                  },
                ],
              };
            },
          });

          statusEl.innerHTML += '<p style="color: green;">✅ Tool registered successfully!</p>';

          // List registered tools
          const tools = await document.modelContext.getTools();
          statusEl.innerHTML += `<p>Registered tools: ${tools.length}</p>`;
          statusEl.innerHTML += '<pre>' + JSON.stringify(tools, null, 2) + '</pre>';
        } catch (error) {
          statusEl.innerHTML += `<p style="color: red;">❌ Error: ${error.message}</p>`;
          statusEl.innerHTML += `<pre>${error.stack}</pre>`;
          console.error(error);
        }
      } else {
        statusEl.innerHTML = '<p style="color: red;">❌ document.modelContext is NOT available</p>';
        console.error('document.modelContext not found');

        // Check what's in window
        statusEl.innerHTML += '<p>Available globals:</p>';
        statusEl.innerHTML +=
          '<pre>' +
          Object.keys(window)
            .filter((k) => k.includes('MCP') || k.includes('Model'))
            .join('\n') +
          '</pre>';
      }
    </script>
  </body>
</html>
