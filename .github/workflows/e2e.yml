name: E2E Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true

jobs:
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: '24'
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: stable
          install-dependencies: false

      - name: Print Chrome version
        run: '"${{ steps.chrome.outputs.chrome-path }}" --version'

      - name: Run DOM reader browser tests
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: pnpm --filter @mcp-b/smart-dom-reader test:local && pnpm --filter @mcp-b/smart-dom-reader-server test:e2e

      - name: Run runtime contract E2E tests
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: pnpm --filter mcp-e2e-tests run test:runtime-contract:transport && pnpm --filter mcp-e2e-tests run test:mcp-iframe

      - name: Run local relay E2E tests
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: pnpm --filter @mcp-b/webmcp-local-relay test:e2e

      - name: Run framework integration E2E tests
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: pnpm test:e2e:frameworks

      - name: Run tarball E2E validation (@mcp-b/global)
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: pnpm test:e2e:tarball:global --skip-build

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7

  extension-e2e:
    name: Extension E2E (Playwright Chromium)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: '24'
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run extension E2E tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: pnpm --filter @mcp-b/transports test:e2e && pnpm --filter @mcp-b/webmcp-extension test:e2e

  native-parity:
    name: Native API Parity (chrome-canary)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout Web Platform Tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: web-platform-tests/wpt
          ref: 9ef2de86389e3f388578fe5fc599c979078c6667
          path: .reference/wpt
          # "interfaces" carries the .idl files that webmcp/idlharness.https.window.js
          # fetches at runtime (webmcp.idl plus its html/dom dependencies). ~1.8 MB.
          sparse-checkout: |
            common
            docs
            interfaces
            resources
            tools
            webmcp

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: '24'
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Setup Chrome Canary
        id: chrome_canary
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: canary
          install-dependencies: false

      # Branded Chrome blocks --load-extension; native extension E2E needs unbranded Chromium.
      - name: Setup Chromium Snapshot
        id: chromium_snapshot
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: latest
          install-dependencies: false

      - name: Print Chrome Canary version
        run: '"${{ steps.chrome_canary.outputs.chrome-path }}" --version'

      - name: Print Chromium Snapshot version
        run: '"${{ steps.chromium_snapshot.outputs.chrome-path }}" --version'

      - name: Run WebMCP WPT against the polyfill
        env:
          CHROME_BIN: ${{ steps.chrome_canary.outputs.chrome-path }}
        run: pnpm test:wpt

      # Passes 20/20 today; non-blocking because hard-gating API shape is a pending
      # decision, not because it fails. See docs/TESTING.md.
      - name: Report WebMCP IDL conformance (non-blocking)
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.chrome_canary.outputs.chrome-path }}
        run: pnpm test:wpt:idl

      - name: Run Native Runtime Contract (Chrome Canary)
        env:
          CHROME_BIN: ${{ steps.chrome_canary.outputs.chrome-path }}
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.chrome_canary.outputs.chrome-path }}
          PLAYWRIGHT_ENABLE_WEBMCP_FLAGS: '1'
        run: pnpm --filter mcp-e2e-tests run test:native-contract:default

      - name: Run native React hook tests
        env:
          CHROME_BIN: ${{ steps.chrome_canary.outputs.chrome-path }}
        run: pnpm --filter usewebmcp test:native

      - name: Run Native Runtime API Integration (Chrome Canary)
        env:
          CHROME_BIN: ${{ steps.chrome_canary.outputs.chrome-path }}
          PLAYWRIGHT_NATIVE_SHOWCASE_EXECUTABLE_PATH: ${{ steps.chrome_canary.outputs.chrome-path }}
        run: pnpm --filter mcp-e2e-tests run test:native-showcase

      - name: Run Native Extension Frame Integration (Chromium Snapshot)
        env:
          PLAYWRIGHT_EXTENSION_CHROMIUM_EXECUTABLE_PATH: ${{ steps.chromium_snapshot.outputs.chrome-path }}
          PLAYWRIGHT_EXTENSION_ENABLE_WEBMCP_FLAGS: '1'
        run: pnpm --filter @mcp-b/webmcp-extension test:e2e

      - name: Upload Parity Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-native-parity-chrome-canary
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload Parity Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-native-parity-chrome-canary
          path: e2e/test-results/
          retention-days: 7
