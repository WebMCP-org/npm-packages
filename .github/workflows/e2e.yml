name: E2E Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Restrict permissions to minimum required
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true

jobs:
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build packages
        run: pnpm build

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd
        with:
          chrome-version: stable
          install-dependencies: false

      - name: Print Chrome version
        run: '"${{ steps.chrome.outputs.chrome-path }}" --version'

      - name: Run runtime contract E2E tests
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: pnpm --filter mcp-e2e-tests run test:runtime-contract:transport && pnpm --filter mcp-e2e-tests run test:mcp-iframe

      - name: Run local relay E2E tests
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: pnpm --filter @mcp-b/webmcp-local-relay test:e2e

      - name: Run framework integration E2E tests
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: pnpm test:e2e:frameworks

      - name: Run tarball E2E validation (@mcp-b/global)
        env:
          PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
        run: pnpm test:e2e:tarball:global

      - name: Upload Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7

  extension-e2e:
    name: Extension E2E (Playwright Chromium)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Run extension E2E tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: pnpm --filter @mcp-b/transports test:e2e && pnpm --filter @mcp-b/webmcp-extension test:e2e

  native-parity:
    name: Native API Parity (chrome-canary)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Web Platform Tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: web-platform-tests/wpt
          ref: c7fdee80f3f17b4e9813964916afdfd57ace863f
          path: .reference/wpt
          # "interfaces" carries the .idl files that webmcp/idlharness.https.window.js
          # fetches at runtime (webmcp.idl plus its html/dom dependencies). ~1.8 MB.
          sparse-checkout: |
            common
            docs
            interfaces
            resources
            tools
            webmcp

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build packages
        run: pnpm build

      - name: Setup Chrome Canary
        id: chrome_canary
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd
        with:
          chrome-version: canary
          install-dependencies: false

      # Branded Chrome blocks --load-extension; native extension E2E needs unbranded Chromium.
      - name: Setup Chromium Snapshot
        id: chromium_snapshot
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd
        with:
          chrome-version: latest
          install-dependencies: false

      - name: Print Chrome Canary version
        run: '"${{ steps.chrome_canary.outputs.chrome-path }}" --version'

      - name: Print Chromium Snapshot version
        run: '"${{ steps.chromium_snapshot.outputs.chrome-path }}" --version'

      - name: Run WebMCP WPT against the polyfill
        env:
          CHROME_BIN: ${{ steps.chrome_canary.outputs.chrome-path }}
        run: pnpm test:wpt

      # Reports API-shape conformance without gating on it. The polyfill now passes
      # idlharness 20/20, matching native Chrome Canary; dropping continue-on-error
      # would make this a hard gate. Left non-blocking pending that decision.
      - name: Report WebMCP IDL conformance (non-blocking)
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.chrome_canary.outputs.chrome-path }}
        run: pnpm test:wpt:idl

      - name: Run Native Runtime Contract (Chrome Canary)
        env:
          CHROME_BIN: ${{ steps.chrome_canary.outputs.chrome-path }}
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ steps.chrome_canary.outputs.chrome-path }}
          PLAYWRIGHT_ENABLE_WEBMCP_FLAGS: '1'
        run: pnpm --filter mcp-e2e-tests run test:native-contract:default

      - name: Run Native Runtime API Integration (Chrome Canary)
        env:
          CHROME_BIN: ${{ steps.chrome_canary.outputs.chrome-path }}
          PLAYWRIGHT_NATIVE_SHOWCASE_EXECUTABLE_PATH: ${{ steps.chrome_canary.outputs.chrome-path }}
        run: pnpm --filter mcp-e2e-tests run test:native-showcase

      - name: Run Native Extension Frame Integration (Chromium Snapshot)
        env:
          PLAYWRIGHT_EXTENSION_CHROMIUM_EXECUTABLE_PATH: ${{ steps.chromium_snapshot.outputs.chrome-path }}
          PLAYWRIGHT_EXTENSION_ENABLE_WEBMCP_FLAGS: '1'
        run: pnpm --filter @mcp-b/webmcp-extension test:e2e

      - name: Upload Parity Playwright Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-native-parity-chrome-canary
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload Parity Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-native-parity-chrome-canary
          path: e2e/test-results/
          retention-days: 7
