version: 2
updates:
  # One pnpm workspace: resolve all manifests against the root lockfile and catalog.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
    labels:
      - 'dependencies'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types: ['minor', 'patch']

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci(deps)'
    labels:
      - 'dependencies'
      - 'github-actions'
    ignore:
      # Action v2 requires a coordinated Changesets CLI v3 migration.
      - dependency-name: 'changesets/action'
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns:
          - '*'
