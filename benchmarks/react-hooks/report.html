<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>WebMCP hook comparison</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: var(--sigvelo-font-sans);
        color: var(--sigvelo-color-text);
        background: var(--sigvelo-color-surface-under);
      }
      article {
        width: 960px;
        margin: 32px;
        padding: 32px;
        background: var(--sigvelo-color-surface);
        border: 1px solid var(--sigvelo-color-neutral-border-muted);
        border-radius: var(--sigvelo-radius-xl);
      }
      h1 {
        margin: 0;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.025em;
      }
      .intro {
        margin: 8px 0 24px;
        font-size: 19px;
        color: var(--sigvelo-color-text-muted);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      th,
      td {
        padding: 17px 0;
        border-top: 1px solid var(--sigvelo-color-neutral-border-muted);
      }
      th {
        width: 310px;
        font-size: 20px;
        font-weight: 500;
      }
      small {
        display: block;
        margin-top: 5px;
        font-size: 15px;
        font-weight: 400;
        color: var(--sigvelo-color-text-muted);
      }
      svg {
        display: block;
        width: 100%;
        height: 22px;
      }
      rect {
        fill: var(--sigvelo-color-viz-series-1);
      }
      .count {
        width: 56px;
        padding-left: 16px;
        text-align: right;
        font-size: 28px;
        font-variant-numeric: tabular-nums;
      }
      .unavailable {
        font-size: 20px;
      }
      .source {
        margin: 20px 0 0;
        font-size: 14px;
        color: var(--sigvelo-color-text-muted);
      }
      .choices {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 24px;
      }
      sigvelo-chart-card::part(heading) {
        font-size: 20px;
      }
      .choices p {
        margin: 10px 0 0;
        font-size: 23px;
        line-height: 1.4;
      }
      .choices small {
        font-size: 17px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <article id="performance" aria-labelledby="performance-title">
      <h1 id="performance-title">Starting 10 overlapping calls</h1>
      <p class="intro">React commits before any call finishes</p>
      <table aria-label="React commits while ten calls start">
        <tbody id="counts"></tbody>
      </table>
      <p class="source" id="measurement-source"></p>
    </article>
    <article id="architecture" aria-labelledby="architecture-title">
      <h1 id="architecture-title">Choose a hook</h1>
      <div class="choices">
        <sigvelo-chart-card heading="usewebmcp">
          <p>Browser tools</p>
          <small>Raw results</small>
        </sigvelo-chart-card>
        <sigvelo-chart-card heading="@mcp-b/react-webmcp">
          <p>Browser tools + MCP</p>
          <small>Formatted results, prompts, resources, clients</small>
        </sigvelo-chart-card>
      </div>
      <p class="intro" style="margin: 20px 0 0">Both use your schema library and runtime.</p>
    </article>
    <script type="module">
      import 'design-tokens';
      import 'design-chart-card';
      import { scaleLinear } from 'design-scale';

      const report = await fetch('./results.json').then((response) => response.json());
      const definitions = [
        ['usewebmcp', 'usewebmcp', 'Core hook · PR #329'],
        ['@mcp-b/react-webmcp', '@mcp-b/react-webmcp', 'MCP adapter · PR #329'],
        ['webmcp-react', 'MCP Cat', 'webmcp-react ' + report.packages['webmcp-react']],
        ['use-webmcp-tool', 'Google', 'use-webmcp-tool ' + report.packages['use-webmcp-tool']],
      ];
      const rows = definitions.map(([name, label, detail]) => {
        const samples = report.samples.filter((row) => row.library === name);
        if (
          samples.length !== 10 ||
          samples.some((row) => row.executionState !== samples[0].executionState)
        ) {
          throw new Error('Expected ten consistent samples per hook');
        }
        const values = samples.map((row) => row.start).sort((a, b) => a - b);
        return {
          name,
          label,
          detail,
          value: samples[0].executionState ? (values[4] + values[5]) / 2 : null,
          range: values[0] === values[9] ? String(values[0]) : values[0] + '–' + values[9],
        };
      });
      const scale = scaleLinear()
        .domain([0, Math.max(1, ...rows.map((row) => row.value ?? 0))])
        .range([0, 500]);
      for (const row of rows) {
        const tr = document.createElement('tr');
        tr.dataset.library = row.name;
        const label = document.createElement('th');
        label.scope = 'row';
        label.textContent = row.label;
        const detail = document.createElement('small');
        detail.textContent = row.detail;
        label.append(detail);
        tr.append(label);
        const cell = document.createElement('td');
        if (row.value === null) {
          cell.colSpan = 2;
          cell.className = 'unavailable';
          cell.textContent = 'Not applicable';
          const reason = document.createElement('small');
          reason.textContent = 'Tracks registration, not running calls.';
          cell.append(reason);
          tr.append(cell);
        } else {
          const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.setAttribute('viewBox', '0 0 500 22');
          svg.setAttribute('preserveAspectRatio', 'none');
          svg.setAttribute('aria-hidden', 'true');
          const bar = document.createElementNS(svg.namespaceURI, 'rect');
          bar.setAttribute('width', String(scale(row.value)));
          bar.setAttribute('height', '22');
          bar.setAttribute('rx', '3');
          svg.append(bar);
          cell.append(svg);
          const count = document.createElement('td');
          count.className = 'count';
          count.textContent = row.range;
          tr.append(cell, count);
        }
        document.querySelector('#counts').append(tr);
      }
      document.querySelector('#measurement-source').textContent =
        'React ' +
        report.packages.react +
        ' · Native Chrome · 10 trials per hook · ' +
        report.recordedAt.slice(0, 10);
      await Promise.all(
        [...document.querySelectorAll('sigvelo-chart-card')].map(
          (element) => element.updateComplete
        )
      );
      await document.fonts.ready;
      window.reportReady = true;
    </script>
  </body>
</html>
